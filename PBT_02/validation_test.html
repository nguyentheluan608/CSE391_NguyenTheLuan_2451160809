<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PBT 02 - Validation Test</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7fb; color: #1f2937; margin: 0; }
        main { max-width: 820px; margin: 30px auto; background: white; padding: 28px; border-radius: 18px; box-shadow: 0 8px 28px rgba(0,0,0,.08); }
        h1 { color: #0f766e; }
        form { display: grid; gap: 16px; }
        label { font-weight: 700; }
        input { width: 100%; padding: 10px; border: 2px solid #cbd5e1; border-radius: 10px; font-size: 16px; box-sizing: border-box; }
        input:invalid { border-color: #dc2626; background: #fff1f2; }
        input:valid { border-color: #16a34a; }
        small { color: #64748b; }
        button { width: fit-content; padding: 12px 22px; border: 0; background: #0f766e; color: white; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .note { background: #ecfeff; border-left: 5px solid #0891b2; padding: 12px; border-radius: 10px; }
    </style>
</head>
<body>
    <main>
        <h1>Kiểm tra HTML5 Validation</h1>
        <p class="note">Các ô bên dưới đang nhập sai dữ liệu để trình duyệt hiển thị trạng thái không hợp lệ khi bấm Submit.</p>
        <form action="#" method="POST">
            <p>
                <label for="case1">Trường hợp 1 - Required để trống</label>
                <input id="case1" name="case1" type="text" required value="" placeholder="Bắt buộc nhập">
                <small>Không được bỏ trống.</small>
            </p>
            <p>
                <label for="case2">Trường hợp 2 - Email sai định dạng</label>
                <input id="case2" name="case2" type="email" value="abc" placeholder="example@email.com">
                <small>Email phải có định dạng hợp lệ.</small>
            </p>
            <p>
                <label for="case3">Trường hợp 3 - Number vượt max</label>
                <input id="case3" name="case3" type="number" min="1" max="10" value="15" placeholder="Nhập số từ 1 đến 10">
                <small>Giá trị chỉ được từ 1 đến 10.</small>
            </p>
            <p>
                <label for="case4">Trường hợp 4 - Pattern 10 chữ số</label>
                <input id="case4" name="case4" type="text" pattern="[0-9]{10}" value="abc123" placeholder="0901234567">
                <small>Chỉ chấp nhận đúng 10 chữ số.</small>
            </p>
            <p>
                <label for="case5">Trường hợp 5 - Password quá ngắn</label>
                <input id="case5" name="case5" type="password" minlength="8" value="123" placeholder="Tối thiểu 8 ký tự">
                <small>Mật khẩu phải có ít nhất 8 ký tự.</small>
            </p>
            <button type="submit">Submit kiểm tra</button>
        </form>
    </main>
</body>
</html>
