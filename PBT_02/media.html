<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia sản phẩm - Shop Kinh Bắc</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #fff7ed; color: #292524; }
        header { background: linear-gradient(135deg, #ea580c, #f97316); color: white; text-align: center; padding: 28px; }
        main { max-width: 1060px; margin: 28px auto; padding: 0 18px; }
        section { background: white; border-radius: 18px; padding: 22px; margin-bottom: 24px; box-shadow: 0 8px 24px rgba(154,52,18,.12); }
        .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        figure { margin: 0; border: 1px solid #fed7aa; border-radius: 16px; overflow: hidden; background: #fffbeb; }
        figure img { display: block; width: 100%; max-width: 100%; height: auto; }
        figcaption { padding: 12px; font-weight: 700; }
        iframe, video { width: 100%; max-width: 760px; border-radius: 16px; border: 0; display: block; }
        audio { width: 100%; max-width: 760px; }
        .logo-box { display: flex; align-items: center; gap: 14px; }
        @media (max-width: 760px) { .gallery { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header>
        <h1>Shop Kinh Bắc - Bộ sản phẩm học tập</h1>
        <p>Trang multimedia dùng ảnh, video, audio, iframe và SVG</p>
    </header>

    <main>
        <section>
            <h2>Logo SVG Inline</h2>
            <p class="logo-box">
                <svg width="70" height="70" viewBox="0 0 70 70" aria-label="Logo Shop Kinh Bắc">
                    <circle cx="35" cy="35" r="32" fill="#ea580c"></circle>
                    <rect x="20" y="25" width="30" height="24" rx="5" fill="#fff7ed"></rect>
                    <path d="M25 25c1-9 19-9 20 0" stroke="#fff7ed" stroke-width="5" fill="none"></path>
                    <text x="35" y="43" text-anchor="middle" font-size="14" fill="#ea580c" font-family="Arial" font-weight="bold">KB</text>
                </svg>
                <span>Logo vector có thể phóng to mà không bị vỡ hình.</span>
            </p>
        </section>

        <section>
            <h2>Ảnh sản phẩm</h2>
            <div class="gallery">
                <figure>
                    <img src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22420%22%20height%3D%22260%22%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20fill%3D%22%23fed7aa%22/%3E%3Ccircle%20cx%3D%2290%22%20cy%3D%2295%22%20r%3D%2248%22%20fill%3D%22%239a3412%22%20opacity%3D%220.25%22/%3E%3Crect%20x%3D%22160%22%20y%3D%2278%22%20width%3D%22180%22%20height%3D%2292%22%20rx%3D%2218%22%20fill%3D%22%239a3412%22%20opacity%3D%220.25%22/%3E%3Ctext%20x%3D%22210%22%20y%3D%22135%22%20font-family%3D%22Arial%22%20font-size%3D%2230%22%20font-weight%3D%22bold%22%20text-anchor%3D%22middle%22%20fill%3D%22%239a3412%22%3ETai%20nghe%3C/text%3E%3C/svg%3E" alt="Tai nghe không dây màu trắng đặt trong hộp sạc" loading="lazy" width="420" height="260" style="max-width: 100%; height: auto;">
                    <figcaption>Tai nghe không dây - 690.000đ</figcaption>
                </figure>
                <figure>
                    <img src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22420%22%20height%3D%22260%22%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20fill%3D%22%23ffedd5%22/%3E%3Ccircle%20cx%3D%2290%22%20cy%3D%2295%22%20r%3D%2248%22%20fill%3D%22%239a3412%22%20opacity%3D%220.25%22/%3E%3Crect%20x%3D%22160%22%20y%3D%2278%22%20width%3D%22180%22%20height%3D%2292%22%20rx%3D%2218%22%20fill%3D%22%239a3412%22%20opacity%3D%220.25%22/%3E%3Ctext%20x%3D%22210%22%20y%3D%22135%22%20font-family%3D%22Arial%22%20font-size%3D%2230%22%20font-weight%3D%22bold%22%20text-anchor%3D%22middle%22%20fill%3D%22%239a3412%22%3EBan%20phim%3C/text%3E%3C/svg%3E" alt="Bàn phím cơ màu cam trắng dành cho học tập và làm việc" loading="lazy" width="420" height="260" style="max-width: 100%; height: auto;">
                    <figcaption>Bàn phím cơ mini - 850.000đ</figcaption>
                </figure>
                <figure>
                    <img src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22420%22%20height%3D%22260%22%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20fill%3D%22%23fef3c7%22/%3E%3Ccircle%20cx%3D%2290%22%20cy%3D%2295%22%20r%3D%2248%22%20fill%3D%22%239a3412%22%20opacity%3D%220.25%22/%3E%3Crect%20x%3D%22160%22%20y%3D%2278%22%20width%3D%22180%22%20height%3D%2292%22%20rx%3D%2218%22%20fill%3D%22%239a3412%22%20opacity%3D%220.25%22/%3E%3Ctext%20x%3D%22210%22%20y%3D%22135%22%20font-family%3D%22Arial%22%20font-size%3D%2230%22%20font-weight%3D%22bold%22%20text-anchor%3D%22middle%22%20fill%3D%22%239a3412%22%3EChuot%3C/text%3E%3C/svg%3E" alt="Chuột máy tính không dây màu đen có đèn led" loading="lazy" width="420" height="260" style="max-width: 100%; height: auto;">
                    <figcaption>Chuột không dây - 320.000đ</figcaption>
                </figure>
            </div>
        </section>

        <section>
            <h2>Video YouTube giới thiệu</h2>
            <iframe width="760" height="420" src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="Video giới thiệu sản phẩm" loading="lazy" allowfullscreen></iframe>
        </section>

        <section>
            <h2>Video HTML5</h2>
            <video controls poster="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22760%22%20height%3D%22420%22%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20fill%3D%22%23fed7aa%22/%3E%3Ccircle%20cx%3D%2290%22%20cy%3D%2295%22%20r%3D%2248%22%20fill%3D%22%239a3412%22%20opacity%3D%220.25%22/%3E%3Crect%20x%3D%22160%22%20y%3D%2278%22%20width%3D%22180%22%20height%3D%2292%22%20rx%3D%2218%22%20fill%3D%22%239a3412%22%20opacity%3D%220.25%22/%3E%3Ctext%20x%3D%22210%22%20y%3D%22135%22%20font-family%3D%22Arial%22%20font-size%3D%2230%22%20font-weight%3D%22bold%22%20text-anchor%3D%22middle%22%20fill%3D%22%239a3412%22%3EVideo%20Review%3C/text%3E%3C/svg%3E" preload="metadata">
                <source src="review-product.mp4" type="video/mp4">
                <source src="review-product.webm" type="video/webm">
                <p>Trình duyệt không hỗ trợ video. <a href="review-product.mp4">Tải video tại đây</a>.</p>
            </video>
        </section>

        <section>
            <h2>Audio giới thiệu</h2>
            <audio controls>
                <source src="intro-audio.mp3" type="audio/mpeg">
                <source src="intro-audio.ogg" type="audio/ogg">
                Trình duyệt không hỗ trợ audio.
            </audio>
        </section>
    </main>
</body>
</html>
