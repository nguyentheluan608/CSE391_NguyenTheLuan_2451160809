<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Form Validator</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><section class="panel"><h1>Đăng ký thành viên Luan Club</h1><p>Validate real-time bằng JavaScript.</p><form id="registerForm" novalidate><label for="fullName">Họ tên</label><input id="fullName" placeholder="Nguyễn Thế Luân"><small id="nameMsg"></small><label for="email">Email</label><input id="email" placeholder="luan@email.com"><small id="emailMsg"></small><label for="password">Mật khẩu</label><input id="password" type="password" placeholder="Mật khẩu mạnh"><div class="meter"><span id="strengthBar"></span></div><small id="passwordMsg"></small><label for="confirmPassword">Xác nhận mật khẩu</label><input id="confirmPassword" type="password" placeholder="Nhập lại mật khẩu"><small id="confirmMsg"></small><label for="phone">Số điện thoại</label><input id="phone" placeholder="0901-234-567" maxlength="12"><small id="phoneMsg"></small><button id="submitBtn" disabled>Đăng ký</button></form></section></main><section id="successModal" class="modal"><article class="modal-card"><h2>Đăng ký thành công!</h2><p id="summary"></p><button id="closeModal">Đóng</button></article></section><script src="app.js"></script></body></html>
