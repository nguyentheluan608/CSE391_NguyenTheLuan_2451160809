<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Keyboard App</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><p class="tag">Accessibility Practice</p><h1>Gallery phím tắt Bắc Ninh</h1><p>Dùng ← → để chuyển ảnh, Space để chạy slideshow, Ctrl+K để mở command palette.</p></header><section class="gallery"><button id="prevBtn" aria-label="Ảnh trước">←</button><figure><img id="mainImage" alt="Ảnh gallery"><figcaption id="caption"></figcaption></figure><button id="nextBtn" aria-label="Ảnh tiếp theo">→</button></section><section id="thumbs" class="thumbs"></section><section class="hint"><button id="openPalette" aria-label="Mở command palette">Ctrl + K</button><span id="status">Slideshow đang dừng</span></section></main><section id="lightbox" class="modal" aria-modal="true"><img id="lightboxImg" alt="Ảnh lớn"><button id="closeLightbox" aria-label="Đóng modal">Đóng</button></section><section id="palette" class="palette" role="dialog" aria-modal="true"><section class="palette-box"><input id="commandSearch" aria-label="Tìm command" placeholder="Gõ command..."><ul id="commandList"></ul></section></section><script src="app.js"></script></body></html>
