<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>User Directory - Nguyễn Thế Luân</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header class="top"><div><p class="tag">PBT_10 - B2</p><h1>Danh bạ người dùng</h1><p>CRUD với JSONPlaceholder, có loading, search và thông báo lỗi.</p></div><button id="reloadBtn">Tải lại</button></header><section class="panel"><form id="userForm" class="user-form"><input type="hidden" id="userId"><label>Họ tên<input id="nameInput" required placeholder="Nguyễn Thế Luân"></label><label>Email<input id="emailInput" type="email" required placeholder="luan@example.com"></label><label>Công ty<input id="companyInput" required placeholder="Luan Digital"></label><button type="submit">Lưu user</button><button type="button" id="resetBtn">Reset</button></form><div class="search-row"><input id="searchInput" placeholder="Tìm theo tên hoặc email"><button id="demoErrorBtn">Demo lỗi</button></div></section><div id="toast" class="toast"></div><section id="userList" class="user-grid"></section></main><script src="app.js"></script></body></html>
