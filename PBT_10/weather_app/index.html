<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App - Nguyễn Thế Luân</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="weather-shell">
        <section class="hero-card">
            <p class="tag">PBT_10 - B1</p>
            <h1>Thời tiết thành phố</h1>
            <p class="intro">Ứng dụng gọi API wttr.in để lấy thời tiết hiện tại và lưu lịch sử tìm kiếm gần nhất.</p>
            <form id="weatherForm" class="search-box">
                <label for="cityInput">Nhập tên thành phố</label>
                <div class="inline-control">
                    <input id="cityInput" type="text" value="Hanoi" placeholder="Ví dụ: Hanoi, Bac Ninh, Da Nang">
                    <button type="submit">Tìm</button>
                </div>
            </form>
        </section>

        <section id="stateBox" class="state-card" aria-live="polite"></section>
        <section class="history-card">
            <h2>Lịch sử tìm kiếm</h2>
            <div id="historyList" class="history-list"></div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
